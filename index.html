<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ===================================================================
       根路径不再承载任何内容，只负责把访客送到对应语言的真实页面：
         /zh/  简体中文（默认，也是 x-default）
         /en/  English
         /ja/  日本語
       GitHub Pages 是纯静态托管，发不出 301，只能用内联 JS 跳转，
       因此这里必须同时给出：
         1. canonical -> /zh/     告诉搜索引擎真正该收录的是 /zh/
         2. 页面里的三条真链接     不执行 JS 的爬虫/浏览器也能走到内容页
       跳转只看 localStorage 里用户上次亲手选过的语言，不看 navigator.language。
       按浏览器语言自动跳转会把 en-US 环境的爬虫送去 /en/，
       让中文站在搜索结果里变成英文站 —— 这正是之前踩过的坑。
       新增语言时记得同步这里的 LANGS、各页面的 hreflang 和 sitemap.xml。
       =================================================================== -->
  <title>MewBaka 笨猫</title>
  <meta name="description" content="MewBaka 笨猫工作室官方网站 - 视觉小说游戏引擎 NarraLeaf Project 开发者，致力于创造有趣的视觉小说体验" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#40A8C4" />
  <meta name="color-scheme" content="light dark" />
  <link rel="canonical" href="https://mewbaka.cn/zh/" />
  <link rel="alternate" hreflang="zh-CN" href="https://mewbaka.cn/zh/" />
  <link rel="alternate" hreflang="en" href="https://mewbaka.cn/en/" />
  <link rel="alternate" hreflang="ja" href="https://mewbaka.cn/ja/" />
  <link rel="alternate" hreflang="x-default" href="https://mewbaka.cn/zh/" />
  <link rel="icon" href="/favicon.ico" />

  <script>
    (function () {
      var LANGS = { 'zh-CN': '/zh/', en: '/en/', ja: '/ja/' };
      var target = null;
      /* 只认用户在本站主动选过并存下来的语言；没存过（含所有爬虫）一律去中文页 */
      try { target = LANGS[localStorage.getItem('lang')] || null; } catch (e) {}
      /* replace 而不是 assign：不留历史记录，返回键不会在这里来回弹 */
      location.replace((target || '/zh/') + location.search + location.hash);
    })();
  </script>

  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{color-scheme:light dark;--text:#1a1a1a;--text-secondary:#555;--bg:#fff;--border:#e5e5e5;--primary:#40A8C4}
    @media(prefers-color-scheme:dark){:root{--text:#e8e8e8;--text-secondary:#aaa;--bg:#111;--border:#333;--primary:#5BBDD4}}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);color:var(--text);line-height:1.6;
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;text-align:center}
    h1{font-size:1.5rem;font-weight:700;margin-bottom:8px}
    p{font-size:.9rem;color:var(--text-secondary);margin-bottom:20px}
    ul{list-style:none;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
    a{display:block;padding:8px 18px;border:1px solid var(--border);border-radius:8px;color:var(--text);text-decoration:none;font-size:.9rem;font-weight:500}
    a:hover{border-color:var(--primary);color:var(--primary)}
  </style>
</head>
<body>
  <main>
    <h1>MewBaka 笨猫</h1>
    <p lang="zh-CN">正在前往中文版…</p>
    <ul>
      <li><a href="/zh/" hreflang="zh-CN" lang="zh-CN">中文</a></li>
      <li><a href="/en/" hreflang="en" lang="en">English</a></li>
      <li><a href="/ja/" hreflang="ja" lang="ja">日本語</a></li>
    </ul>
  </main>
</body>
</html>
